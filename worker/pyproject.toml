[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldminer-worker"
version = "0.1.0"
description = "Mishkah — Iranian gold signal research & paper-trading worker (Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "zoneinfo; python_version<'3.9'",
]

[project.optional-dependencies]
telegram = ["telethon>=1.34"]
prices = ["yfinance>=0.2.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pgserver>=0.1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["postgres: requires a local postgres (PGTEST_URI or pgserver)"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["worker", "tests"]
exclude = "tests/fixtures"

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
